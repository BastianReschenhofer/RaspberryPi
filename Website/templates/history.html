<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verlauf</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .active-range {
            background-color: #0f4c75 !important;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header" style="justify-content: center; text-align: center;">
            <h1 style="width: 100%;">Modus: Verlauf</h1>
        </div>
        
        <div class="button-group">
            <a href="{{ url_for('home.home') }}" class="action-button">Zurück zur Übersicht</a>
        </div>
        
        <div class="button-group" style="margin-top: 10px;">
            <button onclick="setHours(1)" id="btn-1h" class="action-button">1 Std</button>
            <button onclick="setHours(6)" id="btn-6h" class="action-button">6 Std</button>
            <button onclick="setHours(12)" id="btn-12h" class="action-button">12 Std</button>

            <input type="date" id="dateInput" class="date-input">
                <button onclick="loadHistoryData()" class="action-button" >Tag anzeigen</button>
                <button onclick="clearDate()" class="action-button" style="background-color: #7f8c8d;">X</button>

        </div>
        <div class="button-group" style="margin-top: 10px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                
            </div>
        </div>



        <div class="button-group" style="align-items: center;">
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="searchInput" placeholder="Schüler suchen..." class="search-input" oninput="loadHistoryData()">
                
                <select id="classSelect" class="class-select" onchange="loadHistoryData()">
                    <option value="">Alle Klassen</option>
                </select>
                
                <button onclick="resetAll()" id="resetButton" class="action-button" style="background-color: #7f8c8d; display: none;">Reset</button>
            </div>
        </div>
        
        <div class="timeline-grid" id="historyGrid"></div>

    </div>

    <script>
        var currentHours = 12;
        var classesLoaded = false;
        var chartInstances = []; 

        document.addEventListener('DOMContentLoaded', function() {
            
            var params = new URLSearchParams(window.location.search);
            
            if (params.get('hours')) {
                currentHours = parseInt(params.get('hours'));
            }
            if (params.get('name_search')) {
                document.getElementById('searchInput').value = params.get('name_search');
            }
            if (params.get('date_filter')) {
                document.getElementById('dateInput').value = params.get('date_filter');
            }

            updateButtons();
            loadHistoryData();
        });

        function setHours(h) {
            currentHours = h;
            document.getElementById('dateInput').value = '';
            updateButtons();
            loadHistoryData();
        }

        function clearDate() {
            document.getElementById('dateInput').value = '';
            loadHistoryData();
            updateButtons();
        }

        function resetAll() {
            document.getElementById('searchInput').value = '';
            document.getElementById('classSelect').value = '';
            document.getElementById('dateInput').value = '';
            currentHours = 12;
            updateButtons();
            loadHistoryData();
        }

        function updateButtons() {
            document.getElementById('btn-1h').classList.remove('active-range');
            document.getElementById('btn-6h').classList.remove('active-range');
            document.getElementById('btn-12h').classList.remove('active-range');

            var dateVal = document.getElementById('dateInput').value;
            if (!dateVal) {
                if (currentHours === 1) document.getElementById('btn-1h').classList.add('active-range');
                if (currentHours === 6) document.getElementById('btn-6h').classList.add('active-range');
                if (currentHours === 12) document.getElementById('btn-12h').classList.add('active-range');
            }
        }

        function loadHistoryData() {
            var searchVal = document.getElementById('searchInput').value;
            var classVal = document.getElementById('classSelect').value;
            var dateVal = document.getElementById('dateInput').value;

            if (searchVal || classVal || dateVal) {
                document.getElementById('resetButton').style.display = 'inline';
            } else {
                document.getElementById('resetButton').style.display = 'none';
            }

            var url = "{{ url_for('home.get_data_for_history') }}";
            url += "?hours=" + currentHours;
            if (searchVal) url += "&name_search=" + encodeURIComponent(searchVal);
            if (classVal) url += "&class_filter=" + encodeURIComponent(classVal);
            if (dateVal) url += "&date_filter=" + encodeURIComponent(dateVal);

            fetch(url)
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    if (!classesLoaded && data.classes) {
                        fillClassDropdown(data.classes, classVal);
                        classesLoaded = true;
                    }
                    if (data.students) {
                        renderHistoryGrid(data.students);
                    }
                })
                .catch(function(err) {
                    console.error(err);
                });
        }

        function fillClassDropdown(list, current) {
            var select = document.getElementById('classSelect');
            list.forEach(function(cls) {
                var opt = document.createElement('option');
                opt.value = cls;
                opt.text = cls;
                if (cls === current) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function renderHistoryGrid(students) {
            var grid = document.getElementById('historyGrid');
            
            chartInstances.forEach(function(chart) {
                chart.destroy();
            });
            chartInstances = [];

            var html = "";
            students.forEach(function(s) {
                var cssClass = s.present ? 'present' : 'absent';
                var textStatus = s.present ? 'Anwesend' : 'Abwesend';
                var canvasId = 'chart-' + s.id;

                html += '<div class="student-card ' + cssClass + '">';
                html += '<a href="' + s.urls.settings + '" class="settings-btn">&#9881;</a>';
                
                html += '<div class="student-photo">';
                html += '<img src="' + s.urls.image + '" onerror="this.onerror=null; this.src=\'' + s.urls.placeholder + '\';">';
                html += '</div>';
                
                html += '<p class="student-name">' + s.full_name + '</p>';
               
                html += '<div class="chart-wrapper">';
                html += '<canvas id="' + canvasId + '" class="timeline-canvas"></canvas>';
                html += '</div>';
                
                html += '<p class="status-text ' + cssClass + '">' + textStatus + '</p>';
                html += '</div>';
            });

            grid.innerHTML = html;

            students.forEach(function(s) {
                var ctx = document.getElementById('chart-' + s.id);
                if (ctx) {
                    var newChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: s.time_labels,
                            datasets: [{
                                data: s.signal_history,
                                borderColor: '#1a73e8',
                                borderWidth: 2,
                                pointRadius: 0,
                                tension: 0.1,
                                spanGaps: true 
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { display: true, ticks: { maxTicksLimit: 6 } },
                                y: { display: true, min: -100, max: -20 }
                            },
                            animation: false
                        }
                    });
                    chartInstances.push(newChart);
                }
            });
        }
    </script>
</body>
</html>
