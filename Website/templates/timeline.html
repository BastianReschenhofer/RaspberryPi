<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schülerübersicht - Zeitverlauf</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .action-button {
            padding: 15px 25px;
            text-decoration: none;
            color: white;
            background-color: #1a73e8;
            border-radius: 8px;
        }

        .student-card-test {
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 250px;
            position: relative;
        }

        .delete-btn {
            position: absolute;
            top: 10px; right: 10px;
            text-decoration: none; color: #aaa; font-size: 20px;
            z-index: 10;
        }

        /* Styling für runde Bilder */
        .student-photo {
            width: 100px;
            height: 100px;
            background-color: #ffffff;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            border: 3px solid #eee; 
        }

        .student-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .signal-strength {
            font-weight: bold;
            color: #D35400;
            margin: 10px 0;
        }
        
        .chart-wrapper {
            width: 100%;
            height: 120px; 
        }
    </style>
</head>

<body class="test-mode-page">
    <div class="page-container">
        <div class="header" style="text-align: center;">
            <h1>Modus: Zeitverlauf</h1>
        </div>

        <div class="button-group">
            <a href="{{ url_for('home.home') }}" class="action-button">Testmodus verlassen</a>
            <a href="{{ url_for('home.testpage') }}" class="action-button">Zurück zur Übersicht</a>
        </div>

        <div class="student-grid">
            {% for student_item in students if student_item.present %}

            <div class="student-card-test present {{ student_item.signal_class }}">
                <a href="{{ url_for('home.delete_student', student_id=student_item.id) }}" class="delete-btn">&times;</a>
                
                <div class="student-photo"> 
                    <img src="{{ url_for('static', filename='images/' ~ student_item.full_name ~ '.png') }}" 
                         onerror="this.onerror=null; this.src='https://api.dicebear.com/9.x/initials/svg?seed={{ student_item.full_name }}';"
                         alt="Foto von {{ student_item.full_name }}">
                </div>

                <p class="student-name">{{ student_item.full_name }}</p>
                <p class="signal-strength">Aktuell: {{ student_item.signal_strength }} dBm</p>
                
                <div class="chart-wrapper">
                    <canvas 
                        class="timeline-canvas" 
                        data-values='{{ student_item.signal_history | default([]) | tojson }}'>
                    </canvas>
                </div>
            </div>

            {% endfor %}
        </div>
    </div>

    <script>
        const allCharts = document.querySelectorAll('.timeline-canvas');

        allCharts.forEach(canvas => {
            const rawData = canvas.dataset.values; 
            const dataPoints = rawData ? JSON.parse(rawData) : [];

            new Chart(canvas, {
                type: 'line',
                data: {
                    labels: dataPoints.map((_, i) => i + 1),
                    datasets: [{
                        data: dataPoints,
                        borderColor: '#1a73e8',    
                        borderWidth: 2,
                        pointRadius: 1,                        
                        tension: 1           
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false} },
                    scales: {
                        x: { display: false }, 
                        y: { display: true, min: -100, max: -30 }   
                    }
                }
            });
        });
    </script>
</body>
</html>
