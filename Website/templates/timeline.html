<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testmodus Zeitverlauf</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .signal-strength {
            font-weight: bold;
            color: #D35400;
            margin: 10px 0;
        }
        .chart-wrapper {
            width: 100%;
            height: 120px; 
        }

        .signal-strength.range1 { color: #28a745; }
        .signal-strength.range2 { color: #ffa500; }
        .signal-strength.range3 { color: #dc3545; }
    </style>
</head>

<body class="test-mode-page">
    <div class="page-container">
        <div class="header" style="justify-content: center; text-align: center;">
            <h1 style="width: 100%; color: tomato;">Modus: Test</h1>
            <h3 style="width: 100%; color:black">
                Anwesende Schüler: <span id="countPresent">0</span> von <span id="countTotal">0</span>
            </h3>
        </div>
        
        <div class="button-group">
            <a href="{{ url_for('home.home') }}" class="action-button">Testmodus verlassen</a>
            <a href="{{ url_for('home.testpage') }}" id="btnOverview" class="action-button">Zurück zur Übersicht</a>
        </div>

        <div class="button-group" style="align-items: center; justify-content: center;">
            <div style="display: flex; gap: 10px; align-items: center; margin: 0;">
                
                <select id="classSelect" class="class-select" onchange="loadTimelineData()">
                    <option value="">Alle Klassen</option>
                </select>

                <button onclick="loadTimelineData()" class="action-button" style="padding: 15px;">
                    Suchen
                </button>
                
                <button onclick="resetFilter()" id="resetButton" class="action-button" style="background-color: #7f8c8d; display: none;">X</button>
            </div>
        </div>

        <div class="student-grid" id="timelineGrid">
            </div>
    </div>

    <script>
        var classesLoaded = false;
        var chartInstances = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadTimelineData();
            setInterval(loadTimelineData, 3000);
        });

        function resetFilter() {
            document.getElementById('classSelect').value = '';
            loadTimelineData();
        }

        function loadTimelineData() {
            var classVal = document.getElementById('classSelect').value;

            if(classVal) {
                document.getElementById('resetButton').style.display = 'inline-flex';
            } else {
                document.getElementById('resetButton').style.display = 'none';
            }
            var btnOverview = document.getElementById('btnOverview');
            var baseOverviewUrl = "{{ url_for('home.testpage') }}";
            if(classVal) {
                btnOverview.href = baseOverviewUrl + "?class_filter=" + encodeURIComponent(classVal);
            } else {
                btnOverview.href = baseOverviewUrl;
            }

            var url = "{{ url_for('home.get_data_for_testmode') }}";
            if (classVal) {
                url += "?class_filter=" + encodeURIComponent(classVal);
                window.history.replaceState(null, '', window.location.pathname + "?class_filter=" + encodeURIComponent(classVal));
            } else {
                window.history.replaceState(null, '', window.location.pathname);
            }

            fetch(url)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                   
                    if (data.meta) {
                        document.getElementById('countPresent').innerText = data.meta.present_count;
                        document.getElementById('countTotal').innerText = data.meta.total_count;
                    }

                    if (!classesLoaded && data.classes) {
                        fillClassDropdown(data.classes, classVal);
                        classesLoaded = true;
                    }

                    if (data.students) {
                        renderTimelineGrid(data.students);
                    }
                })
                .catch(function(err) { console.error(err); });
        }

        function fillClassDropdown(list, current) {
            var select = document.getElementById('classSelect');
            list.forEach(function(cls) {
                var opt = document.createElement('option');
                opt.value = cls;
                opt.text = cls;
                if(cls === current) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function renderTimelineGrid(students) {
            var grid = document.getElementById('timelineGrid');
            
            chartInstances.forEach(function(chart) {
                chart.destroy();
            });
            chartInstances = [];

            var html = "";
            students.forEach(function(s) {
                html += '<div class="student-card-test present ' + s.signal_class + '">';
                
                html += '<div class="student-photo">';
                html += '<img src="' + s.urls.image + '" onerror="this.onerror=null; this.src=\'' + s.urls.placeholder + '\';">';
                html += '</div>';

                html += '<p class="student-name">' + s.full_name + '</p>';
                html += '<p class="signal-strength ' + s.signal_class + '">Signal: ' + s.signal_strength + ' dBm</p>';
                
                html += '<div class="chart-wrapper">';
                html += '<canvas id="chart-' + s.id + '" class="timeline-canvas"></canvas>';
                html += '</div>';

                html += '</div>';
            });
            grid.innerHTML = html;

           
            students.forEach(function(s) {
                var ctx = document.getElementById('chart-' + s.id);
                if (ctx) {
                  
                    var dataPoints = s.signal_history; 
                    
                    var labels = [];
                    for(var i=0; i<dataPoints.length; i++) {
                        labels.push(i+1);
                    }

                    var newChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                data: dataPoints,
                                borderColor: '#1a73e8',    
                                borderWidth: 2,
                                pointRadius: 1,                        
                                tension: 0.1 
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false} },
                            scales: {
                                x: { display: false }, 
                                y: { 
                                    display: true, 
                                    min: -100, 
                                    max: -20,
                                    ticks: {
                                        callback: function(value, index, ticks) {
                                            return value + ' dBm';
                                        }
                                    }
                                }   
                            },
                            
                            animation: false 
                        }
                    });
                    chartInstances.push(newChart);
                }
            });
        }
    </script>
</body>
</html>
