<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testmodus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .signal-strength {
            font-size: 1.2em;
            font-weight: 700;
            margin-top: 10px;
        }
        .signal-strength.range1 { color: #28a745; }
        .signal-strength.range2 { color: #ffa500; }
        .signal-strength.range3 { color: #dc3545; }
    </style>
</head>

<body class="test-mode-page"> 
    <div class="page-container">
        <div class="header" style="justify-content: center; text-align: center;">
            <h1 style="width: 100%; color: tomato;">Modus: Test</h1>
        
            <h3 style="width: 100%; color:black">
                Anwesende Schüler: <span id="countPresent">0</span> von <span id="countTotal">0</span>
            </h3>
        </div>

        <div class="button-group">
            <a href="{{ url_for('home.home') }}" class="action-button">Testmodus verlassen</a>
            
            <a href="{{ url_for('home.timeline') }}" id="btnTimeline" class="action-button">Zeitverlauf</a>
        </div>

        <div class="button-group" style="align-items: center; justify-content: center;">
            <div style="display: flex; gap: 10px; align-items: center; margin: 0;">
                
                <select id="classSelect" class="class-select" onchange="loadTestData()">
                    <option value="">Alle Klassen</option>
                </select>
                
                <button onclick="resetFilter()" id="resetButton" class="action-button" style="background-color: #7f8c8d; display: none;">
                    X
                </button>
            </div>
        </div>

        <div class="student-grid" id="testGrid">
            </div>
    </div>
    
    <script>
        var classesLoaded = false;

        document.addEventListener('DOMContentLoaded', function() {
            var params = new URLSearchParams(window.location.search);
            if(params.get('class_filter')) {
               
            }
            
            loadTestData();
            setInterval(loadTestData, 3000);
        });

        function resetFilter() {
            document.getElementById('classSelect').value = '';
            loadTestData();
        }

        function loadTestData() {
            var classVal = document.getElementById('classSelect').value;
            
            if(classVal) {
                document.getElementById('resetButton').style.display = 'inline-flex';
            } else {
                document.getElementById('resetButton').style.display = 'none';
            }
            var timelineBtn = document.getElementById('btnTimeline');
            var baseTimelineUrl = "{{ url_for('home.timeline') }}";
            if (classVal) {
                timelineBtn.href = baseTimelineUrl + "?class_filter=" + encodeURIComponent(classVal);
            } else {
                timelineBtn.href = baseTimelineUrl;
            }

            var url = "{{ url_for('home.get_data_for_testmode') }}";
            if (classVal) {
                url += "?class_filter=" + encodeURIComponent(classVal);
                
            } else {
                window.history.replaceState(null, '', window.location.pathname);
            }

            fetch(url)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                
                    if (data.meta) {
                        document.getElementById('countPresent').innerText = data.meta.present_count;
                        document.getElementById('countTotal').innerText = data.meta.total_count;
                    }

                    if (!classesLoaded && data.classes) {
                        fillClassDropdown(data.classes, classVal);
                        classesLoaded = true;
                    }

                    if (data.students) {
                        renderTestGrid(data.students);
                    }
                })
                .catch(function(err) { console.error(err); });
        }

        function fillClassDropdown(list, current) {
            var select = document.getElementById('classSelect');
            list.forEach(function(cls) {
                var opt = document.createElement('option');
                opt.value = cls;
                opt.text = cls;
                if(cls === current) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function renderTestGrid(students) {
            var grid = document.getElementById('testGrid');
            var html = "";

            students.forEach(function(s) {
                
                html += '<div class="student-card-test present ' + s.signal_class + '">';
                
                html += '<div class="student-photo">';
                html += '<img src="' + s.urls.image + '" onerror="this.onerror=null; this.src=\'' + s.urls.placeholder + '\';">';
                html += '</div>';
                
                html += '<p class="student-name">' + s.full_name + '</p>';
                
                html += '<p class="signal-strength ' + s.signal_class + '">Signal: ' + s.signal_strength + ' dBm</p>';
                
                html += '</div>';
            });

            grid.innerHTML = html;
        }
    </script>
</body>
</html>
