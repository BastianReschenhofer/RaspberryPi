<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schülerübersicht</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-container">
        <div class="header" style="justify-content: center; text-align: center;">
            <h1 style="width: 100%;">Modus: Anwesenheit</h1>
        </div>
        
        <div class="button-group">
            <a href="{{ url_for('home.add_student') }}" class="action-button">Schüler hinzufügen</a>
            <a href="{{ url_for('home.testpage') }}" class="testButton">TestModus</a>
            <a href="{{ url_for('home.history') }}" class="action-button">Anwesenheits Verlauf</a>
        </div>
       
        <div class="button-group" style="align-items: center; flex-wrap: wrap;">
            
            <div style="display: flex; gap: 10px; align-items: center; margin: 0;">
                
                <input type="text" 
                    id="searchInput"
                    placeholder="Schüler suchen..." 
                    class="search-input"
                    oninput="loadData()">

                <select id="classSelect" class="class-select" onchange="loadData()">
                    <option value="">Alle Klassen</option>
                </select>

                <button type="button" class="action-button" style="padding: 15px;" onclick="loadData()">
                    Suchen
                </button>
                
                <button type="button" id="resetButton" class="action-button" style="background-color: #7f8c8d; display: none;" onclick="resetFilters()">
                    X
                </button>

            </div>
        </div>
        
        <div class="student-grid" id="studentGrid"></div>

        <div class="button-group" style="justify-content: end;">
            <a href="{{ url_for('login') }}" class="testButton">Abmelden</a>
        </div>
    </div>

    <script>
        var classesLoaded = false;

        document.addEventListener('DOMContentLoaded', function() {

            var params = new URLSearchParams(window.location.search);
            var searchName = params.get('name_search');
            var classFilter = params.get('class_filter');

            if (searchName) {
                document.getElementById('searchInput').value = searchName;
            }

            loadData();

            setInterval(loadData, 3000);
        });

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('classSelect').value = '';
            loadData();
        }

        function loadData() {
    
            var searchInput = document.getElementById('searchInput');
            var classSelect = document.getElementById('classSelect');
            var resetButton = document.getElementById('resetButton');

            var nameVal = searchInput.value;
            var classVal = classSelect.value;

            if (nameVal || classVal) {
                resetButton.style.display = 'inline-flex';
            } else {
                resetButton.style.display = 'none';
            }

            var url = "{{ url_for('home.get_data_for_homepage') }}";
            url += "?name_search=" + encodeURIComponent(nameVal);
            url += "&class_filter=" + encodeURIComponent(classVal);


            fetch(url)
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    
                    if (classesLoaded === false && data.classes) {
                        fillClassDropdown(data.classes, classVal);
                        classesLoaded = true;
                    }

                    if (data.students) {
                        renderStudents(data.students);
                    }
                })
                .catch(function(err) {
                    console.error("Fehler:", err);
                });
        }

        function fillClassDropdown(classList, currentSelection) {
            var select = document.getElementById('classSelect');
            
            classList.forEach(function(cls) {
                var option = document.createElement('option');
                option.value = cls;
                option.text = cls;
                
                if (cls === currentSelection) {
                    option.selected = true;
                }
                
                select.appendChild(option);
            });
        }

        function renderStudents(studentList) {
            var grid = document.getElementById('studentGrid');
            var html = "";

            studentList.forEach(function(student) {
                var cssClass = "absent";
                var textStatus = "Abwesend";
                
                if (student.present) {
                    cssClass = "present";
                    textStatus = "Anwesend";
                }

                html += '<div class="student-card ' + cssClass + '" onclick="window.location.href=\'' + student.urls.history + '\';" style="cursor: pointer;">';
                
                html += '<a href="' + student.urls.settings + '" class="settings-btn" title="Einstellungen">&#9881;</a>';
                
                html += '<div class="student-photo">';
                html += '<img src="' + student.urls.image + '" onerror="this.onerror=null; this.src=\'' + student.urls.placeholder + '\';" alt="Foto">';
                html += '</div>';
                
                html += '<p class="student-name">' + student.full_name + '</p>';
                html += '<p class="status-text ' + cssClass + '">' + textStatus + '</p>';
                
                html += '</div>';
            });

            grid.innerHTML = html;
        }
    </script>
</body>
</html>
